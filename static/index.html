<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d3557">
<meta name="description" content="subwatch — локальний трекер підписок. Без хмари, без акаунтів, без телеметрії.">
<meta property="og:title" content="subwatch — локальний трекер підписок">
<meta property="og:description" content="Дізнайтесь, скільки ви насправді платите за підписки. Без хмари, без акаунтів — усе в одному SQLite-файлі.">
<meta property="og:type" content="website">
<meta property="og:image" content="/static/favicon.svg">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>subwatch</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #ccc; padding: .35rem .6rem; text-align: left; }
  .warn { background: #fdecea; }
  .tocancel { background: #fdecea; box-shadow: inset 3px 0 0 #e63946; }
  .tocancel .badge { color: #e63946; font-weight: 700; white-space: nowrap; }
  .cards { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: .8rem 1.2rem; }
  .card b { display: block; font-size: 1.4rem; }
  .card-total { border-color: #1d3557; background: #1d3557; color: #f1faee; box-shadow: 0 2px 10px rgba(29,53,87,.35); }
  .card-total b { color: #f1faee; font-size: 1.7rem; }
  .filters { display: inline-flex; gap: .4rem; margin-left: .75rem; vertical-align: middle; }
  .filters button, .lang-switch button { border: 1px solid #ccc; background: #fff; border-radius: 999px; padding: .2rem .8rem; cursor: pointer; font-size: .9rem; }
  .filters button.on, .lang-switch button.on { background: #1d3557; color: #f1faee; border-color: #1d3557; }
  .lang-switch { margin-left: .5rem; }
  .logo { font-size: 1.3rem; margin-right: .3rem; }
  .paused td { color: #888; }
  .due { font-weight: 600; }
  .alert-badge { background: #e63946; color: #f1faee; border-radius: 999px;
    padding: .05rem .55rem; font-size: .85rem; vertical-align: middle; }
  .priceup td { background: #fff7e6; }
  .priceup .price-mark { color: #b45309; font-weight: 700; white-space: nowrap; }
  .demo-banner { border: 1px dashed #1d3557; border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; }
  .demo-banner button { cursor: pointer; }
  :is(button, a, select, input):focus-visible { outline: 3px solid #1d3557; outline-offset: 2px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<h1>subwatch
  <span id="alert-badge" class="alert-badge" hidden aria-label="Нові алерти зміни ціни" data-i18n-aria="alert.badge_aria"></span>
  <span class="lang-switch" id="lang-switch" role="group" aria-label="Мова інтерфейсу" data-i18n-aria="lang.aria">
    <button type="button" data-lang="uk" class="on" aria-pressed="true">UA</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </span>
</h1>
<p><span data-i18n="app.tagline">Локальний трекер підписок. Дані — лише у вашому SQLite.</span>
  <a href="/api/export.ics" data-i18n="export.ics">Експорт .ics</a></p>
<div id="demo-banner" class="demo-banner" hidden role="status"></div>
<div class="cards" id="cards"></div>

<h2 data-i18n="subs.title">Підписки (за датою списання)
  <span class="filters" id="filters" role="group">
    <button type="button" data-f="all" class="on">Усі</button>
    <button type="button" data-f="active">Активні</button>
    <button type="button" data-f="paused">На паузі</button>
  </span>
</h2>
<table id="subs" aria-label="Підписки"></table>

<h2 data-i18n="upcoming.title">Найближчі 30 днів</h2>
<table id="upcoming" aria-label="Майбутні списання"></table>

<h2 data-i18n="cancel.title">Як скасувати (помічник)</h2>
<p>
  <label for="cancel-service" data-i18n="cancel.service">Сервіс:</label>
  <select id="cancel-service" aria-label="Оберіть сервіс для інструкції скасування" data-i18n-aria="cancel.select_aria"></select>
  <button type="button" id="cancel-show" aria-label="Показати інструкцію скасування" data-i18n="cancel.show" data-i18n-aria="cancel.show_aria">Показати</button>
</p>
<div id="cancel-guide" aria-live="polite"></div>

<p>
  <a href="/api/export.json" data-i18n="export.json">Експорт JSON</a> ·
  <a href="/api/export.csv" data-i18n="export.csv">Експорт CSV</a>
</p>

<script>
function money(x, c) { return x.toFixed(2) + ' ' + c; }

// --- i18n: UA/EN словники, авто-детект мови браузера, збереження вибору ---
let STR = {};
let LANG = 'uk';
let lastSubs = null;
let lastSummary = null, lastUpcoming = null, lastEmpty = false;
async function loadI18n() {
  const saved = localStorage.getItem('subwatch.lang');
  const browser = (navigator.language || '').toLowerCase();
  LANG = saved || (browser.startsWith('uk') ? 'uk' : 'en');
  if (!['uk', 'en'].includes(LANG)) LANG = 'uk';
  await setLang(LANG, false);
}
async function setLang(lang, save = true) {
  LANG = lang;
  STR = await (await fetch(`/static/i18n/${lang}.json`)).json();
  if (save) localStorage.setItem('subwatch.lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('#lang-switch button').forEach(b => {
    const on = b.dataset.lang === lang;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  document.querySelectorAll('[data-i18n]').forEach(el =>
    el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el =>
    el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  if (lastSubs) drawSubs(lastSubs);
  renderCards(lastSummary);
  renderUpcoming(lastUpcoming);
  renderDemoBanner(lastEmpty);
}
function t(key, vars) {
  let s = STR[key] !== undefined ? STR[key] : key;
  if (vars) for (const [k, v] of Object.entries(vars))
    s = s.replaceAll(`{${k}}`, v);
  return s;
}
document.getElementById('lang-switch').addEventListener('click', (e) => {
  const lang = e.target && e.target.dataset && e.target.dataset.lang;
  if (lang && lang !== LANG) setLang(lang);
});

// --- emoji-лого картки: за назвою сервісу або тегом ---
const EMOJI = [
  [/netflix|video|відео|hbo|disney|prime/, '🎬'],
  [/spotify|music|музик|audio|deezer|sound/, '🎧'],
  [/youtube|twitch|stream/, '📺'],
  [/gym|fitness|фітнес|спорт|sport|run/, '🏋️'],
  [/icloud|cloud|хмар|dropbox|drive|storage|диск/, '☁️'],
  [/game|gamepass|xbox|playstation|steam|epic|ігор/, '🎮'],
  [/adobe|figma|canva|design|software|office|github/, '💻'],
  [/ai|gpt|claude|copilot|gemini/, '🤖'],
  [/news|журнал|press|media|підкаст/, '📰'],
  [/food|meal|glovo|pizza|їж/, '🍕'],
  [/bank|фінанс|finance|insurance|страх/, '💳'],
  [/vpn|nord|proton/, '🔒'],
  [/book|книг|audible/, '📚'],
  [/mobile|kyivstar|vodafone|звяз/, '📱'],
];
function emoji(sub) {
  const hay = ((sub.name || '') + ' ' + (sub.tags || '')).toLowerCase();
  for (const [re, e] of EMOJI) if (re.test(hay)) return e;
  return '📦';
}

// --- фільтр paused/active + рендер таблиці ---
let filter = 'all';
let unseenAlertIds = new Set();
function drawSubs(subs) {
  lastSubs = subs;
  const visible = subs.filter(x =>
    filter === 'all' ? true : (filter === 'paused' ? x.paused : !x.paused));
  document.getElementById('subs').innerHTML =
    `<tr><th scope="col"></th><th scope="col">${t('col.name')}</th><th scope="col">${t('col.amount')}</th>` +
    `<th scope="col">${t('col.cycle')}</th><th scope="col">${t('col.next_due')}</th>` +
    `<th scope="col">${t('col.trial')}</th><th scope="col">${t('col.status')}</th>` +
    `<th scope="col">${t('col.payer')}</th><th scope="col">${t('col.actions')}</th></tr>` +
    (visible.map(x => {
      const alerted = unseenAlertIds.has(x.id);
      const cls = x.cancel_planned ? ' class="tocancel"'
                : (alerted ? ' class="priceup"'
                : (x.trial_end_date ? ' class="warn"'
                : (x.paused ? ' class="paused"' : '')));
      const badge = x.cancel_planned
        ? `<span class="badge">${t('badge.cancel_before', {deadline: x.cancel_deadline})}</span>`
        : (alerted ? `<span class="price-mark">${t('badge.price_changed')}</span>`
        : (x.paused ? t('badge.paused') : ''));
      return `<tr${cls}><td><span class="logo" role="img" aria-label="${x.name}">${emoji(x)}</span></td>` +
      `<td>${x.name}</td><td>${money(x.amount, x.currency)}</td><td>${x.cycle}</td>` +
      `<td class="due">${x.next_due_date}</td>` +
      `<td>${x.trial_end_date || '—'}</td><td>${badge}</td>` +
      `<td>${x.payer ? `${x.payer}${x.share_pct != null && x.share_pct !== 100 ? ` (${x.share_pct}%)` : ''}${x.owner ? ` · ${x.owner}` : ''}` : '—'}</td>` +
      `<td><button type="button" class="del" data-del="${x.id}" data-name="${x.name}" aria-label="${t('delete.aria', {name: x.name})}">🗑</button></td></tr>`;
    }).join('') ||
     `<tr><td colspan="9">${t('empty.subs')}</td></tr>`);
}
document.getElementById('subs').addEventListener('click', async (e) => {
  const btn = e.target.closest && e.target.closest('button[data-del]');
  if (!btn) return;
  if (!confirm(t('delete.confirm', {name: btn.dataset.name}))) return;
  await fetch(`/api/subscriptions/${btn.dataset.del}`, {method: 'DELETE'});
  load();
});
document.getElementById('filters').addEventListener('click', (e) => {
  const f = e.target && e.target.dataset && e.target.dataset.f;
  if (!f) return;
  filter = f;
  document.querySelectorAll('#filters button').forEach(b =>
    b.classList.toggle('on', b.dataset.f === f));
  drawSubs(lastSubs || []);
});

// --- cancel assistant: статична база знань топ-20 сервісів ---
async function loadCancelAssistant() {
  const sel = document.getElementById('cancel-service');
  const services = await (await fetch('/api/cancel-assistant')).json();
  sel.innerHTML = services.map(s =>
    `<option value="${s.id}">${s.name}</option>`).join('');
}
document.getElementById('cancel-show').addEventListener('click', async () => {
  const id = document.getElementById('cancel-service').value;
  const g = await (await fetch(`/api/cancel-assistant/${id}`)).json();
  const steps = LANG === 'en' ? g.steps_en : g.steps_uk;
  document.getElementById('cancel-guide').innerHTML =
    `<p><a href="${g.cancel_url}" target="_blank" rel="noopener">${g.cancel_url}</a></p>` +
    `<ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
});
loadCancelAssistant();

// --- алерти зміни ціни: бейдж із кількістю непрочитаних + мітка в рядку ---
async function loadAlerts() {
  const alerts = await (await fetch('/api/alerts?unseen_only=true')).json();
  unseenAlertIds = new Set(alerts.map(a => a.subscription_id));
  const badge = document.getElementById('alert-badge');
  badge.hidden = alerts.length === 0;
  badge.textContent = alerts.length ? `🔔 ${alerts.length}` : '';
  if (lastSubs) drawSubs(lastSubs);
}

function renderCards(s) {
  if (!s) return;
  const monthly = Object.entries(s.monthly_by_currency).map(([c, v]) => money(v, c)).join(' + ') || '—';
  document.getElementById('cards').innerHTML =
    `<div class="card card-total" id="total-card">💳 ${t('card.total')}<b>${monthly}</b></div>` +
    `<div class="card">${t('card.active')}<b>${s.active_count}</b></div>` +
    `<div class="card">${t('card.paused')}<b>${s.paused_count}</b></div>` +
    `<div class="card">${t('card.yearly')}<b>${Object.entries(s.yearly_by_currency).map(([c, v]) => money(v, c)).join(' + ') || '—'}</b></div>`;
}
function renderUpcoming(up) {
  if (!up) return;
  document.getElementById('upcoming').innerHTML =
    `<tr><th scope="col">${t('col.date')}</th><th scope="col">${t('col.what')}</th><th scope="col">${t('col.amount')}</th><th scope="col">${t('col.warning')}</th></tr>` +
    (up.map(x =>
      `<tr${x.warning ? ' class="warn"' : ''}><td>${x.date}</td>` +
      `<td>${emoji(x.subscription)} ${x.kind === 'trial_end' ? t('kind.trial_end') : ''} ${x.subscription.name}</td>` +
      `<td>${money(x.subscription.amount, x.subscription.currency)}</td>` +
      `<td>${x.kind === 'trial_end' && x.warning ? t('warn.cancel_before') : ''}</td></tr>`).join('') ||
     `<tr><td colspan="4">${t('empty.upcoming')}</td></tr>`);
}
function renderDemoBanner(empty) {
  const el = document.getElementById('demo-banner');
  el.hidden = !empty;
  if (empty) {
    el.innerHTML =
      `${t('demo.banner')} <button type="button" id="demo-seed" aria-label="${t('demo.seed')}">${t('demo.seed')}</button>`;
    document.getElementById('demo-seed').addEventListener('click', async () => {
      await fetch('/api/demo/seed', {method: 'POST'});
      location.reload();
    });
  }
}

async function load() {
  const s = await (await fetch('/api/summary')).json();
  lastSummary = s;
  renderCards(s);

  const subs = await (await fetch('/api/subscriptions')).json();
  lastEmpty = subs.length === 0;
  renderDemoBanner(lastEmpty);
  drawSubs(subs);

  const up = await (await fetch('/api/upcoming?days=30')).json();
  lastUpcoming = up;
  renderUpcoming(up);
}
load();
loadAlerts();
loadI18n();
// --- PWA: service worker + web notifications про списання сьогодні ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(() => {});
}
async function notifyToday() {
  if (!('Notification' in window)) return;
  let perm = Notification.permission;
  if (perm === 'default') perm = await Notification.requestPermission();
  if (perm !== 'granted') return;
  const items = await (await fetch('/api/today')).json();
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({type: 'charges-today', items});
  } else if (items.length) {
    new Notification(`Списань сьогодні: ${items.length}`,
                     {body: items.map(s => `${s.name} — ${money(s.amount, s.currency)}`).join('\n')});
  }
}
notifyToday();
</script>
</body>
</html>
