<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d3557">
<meta name="description" content="subwatch — локальний трекер підписок. Без хмари, без акаунтів, без телеметрії.">
<meta property="og:title" content="subwatch — локальний трекер підписок">
<meta property="og:description" content="Дізнайтесь, скільки ви насправді платите за підписки. Без хмари, без акаунтів — усе в одному SQLite-файлі.">
<meta property="og:type" content="website">
<meta property="og:image" content="/static/favicon.svg">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>subwatch</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #ccc; padding: .35rem .6rem; text-align: left; }
  .warn { background: #fdecea; }
  .tocancel { background: #fdecea; box-shadow: inset 3px 0 0 #e63946; }
  .tocancel .badge { color: #e63946; font-weight: 700; white-space: nowrap; }
  .cards { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: .8rem 1.2rem; }
  .card b { display: block; font-size: 1.4rem; }
  .card-total { border-color: #1d3557; background: #1d3557; color: #f1faee; box-shadow: 0 2px 10px rgba(29,53,87,.35); }
  .card-total b { color: #f1faee; font-size: 1.7rem; }
  .filters { display: inline-flex; gap: .4rem; margin-left: .75rem; vertical-align: middle; }
  .filters button { border: 1px solid #ccc; background: #fff; border-radius: 999px; padding: .2rem .8rem; cursor: pointer; font-size: .9rem; }
  .filters button.on { background: #1d3557; color: #f1faee; border-color: #1d3557; }
  .logo { font-size: 1.3rem; margin-right: .3rem; }
  .paused td { color: #888; }
  .due { font-weight: 600; }
</style>
</head>
<body>
<h1>subwatch</h1>
<p>Локальний трекер підписок. Дані — лише у вашому SQLite. <a href="/api/export.ics">Експорт .ics</a></p>
<div class="cards" id="cards"></div>

<h2>Підписки (за датою списання)
  <span class="filters" id="filters">
    <button data-f="all" class="on">Усі</button>
    <button data-f="active">Активні</button>
    <button data-f="paused">На паузі</button>
  </span>
</h2>
<table id="subs"></table>

<h2>Найближчі 30 днів</h2>
<table id="upcoming"></table>

<h2>Як скасувати (помічник)</h2>
<p>
  <label for="cancel-service">Сервіс:</label>
  <select id="cancel-service" aria-label="Оберіть сервіс для інструкції скасування"></select>
  <button id="cancel-show" aria-label="Показати інструкцію скасування">Показати</button>
</p>
<div id="cancel-guide" aria-live="polite"></div>

<script>
function money(x, c) { return x.toFixed(2) + ' ' + c; }

// --- emoji-лого картки: за назвою сервісу або тегом ---
const EMOJI = [
  [/netflix|video|відео|hbo|disney|prime/, '🎬'],
  [/spotify|music|музик|audio|deezer|sound/, '🎧'],
  [/youtube|twitch|stream/, '📺'],
  [/gym|fitness|фітнес|спорт|sport|run/, '🏋️'],
  [/icloud|cloud|хмар|dropbox|drive|storage|диск/, '☁️'],
  [/game|gamepass|xbox|playstation|steam|epic|ігор/, '🎮'],
  [/adobe|figma|canva|design|software|office|github/, '💻'],
  [/ai|gpt|claude|copilot|gemini/, '🤖'],
  [/news|журнал|press|media|підкаст/, '📰'],
  [/food|meal|glovo|pizza|їж/, '🍕'],
  [/bank|фінанс|finance|insurance|страх/, '💳'],
  [/vpn|nord|proton/, '🔒'],
  [/book|книг|audible/, '📚'],
  [/mobile|kyivstar|vodafone|звяз/, '📱'],
];
function emoji(sub) {
  const hay = ((sub.name || '') + ' ' + (sub.tags || '')).toLowerCase();
  for (const [re, e] of EMOJI) if (re.test(hay)) return e;
  return '📦';
}

// --- фільтр paused/active + рендер таблиці ---
let filter = 'all';
let lastSubs = null;
function drawSubs(subs) {
  lastSubs = subs;
  const visible = subs.filter(x =>
    filter === 'all' ? true : (filter === 'paused' ? x.paused : !x.paused));
  document.getElementById('subs').innerHTML =
    '<tr><th></th><th>Назва</th><th>Сума</th><th>Цикл</th><th>Наступне списання</th><th>Тріал</th><th>Статус</th></tr>' +
    (visible.map(x => {
      const cls = x.cancel_planned ? ' class="tocancel"'
                : (x.trial_end_date ? ' class="warn"'
                : (x.paused ? ' class="paused"' : ''));
      const badge = x.cancel_planned
        ? `<span class="badge">⛔ скасувати до ${x.cancel_deadline}</span>`
        : (x.paused ? '⏸ пауза' : '');
      return `<tr${cls}><td><span class="logo">${emoji(x)}</span></td>` +
      `<td>${x.name}</td><td>${money(x.amount, x.currency)}</td><td>${x.cycle}</td>` +
      `<td class="due">${x.next_due_date}</td>` +
      `<td>${x.trial_end_date || '—'}</td><td>${badge}</td></tr>`;
    }).join('') ||
     '<tr><td colspan="7">немає підписок у цьому фільтрі</td></tr>');
}
document.getElementById('filters').addEventListener('click', (e) => {
  const f = e.target && e.target.dataset && e.target.dataset.f;
  if (!f) return;
  filter = f;
  document.querySelectorAll('#filters button').forEach(b =>
    b.classList.toggle('on', b.dataset.f === f));
  drawSubs(lastSubs || []);
});

// --- cancel assistant: статична база знань топ-20 сервісів ---
async function loadCancelAssistant() {
  const sel = document.getElementById('cancel-service');
  const services = await (await fetch('/api/cancel-assistant')).json();
  sel.innerHTML = services.map(s =>
    `<option value="${s.id}">${s.name}</option>`).join('');
}
document.getElementById('cancel-show').addEventListener('click', async () => {
  const id = document.getElementById('cancel-service').value;
  const g = await (await fetch(`/api/cancel-assistant/${id}`)).json();
  const lang = localStorage.getItem('subwatch.lang') || 'uk';
  const steps = lang === 'en' ? g.steps_en : g.steps_uk;
  document.getElementById('cancel-guide').innerHTML =
    `<p><a href="${g.cancel_url}" target="_blank" rel="noopener">${g.cancel_url}</a></p>` +
    `<ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
});
loadCancelAssistant();

async function load() {
  const s = await (await fetch('/api/summary')).json();
  const monthly = Object.entries(s.monthly_by_currency).map(([c, v]) => money(v, c)).join(' + ') || '—';
  document.getElementById('cards').innerHTML =
    `<div class="card card-total" id="total-card">💳 Разом на місяць<b>${monthly}</b></div>` +
    `<div class="card">Активних<b>${s.active_count}</b></div>` +
    `<div class="card">На паузі<b>${s.paused_count}</b></div>` +
    `<div class="card">На рік<b>${Object.entries(s.yearly_by_currency).map(([c, v]) => money(v, c)).join(' + ') || '—'}</b></div>`;

  const subs = await (await fetch('/api/subscriptions')).json();
  drawSubs(subs);

  const up = await (await fetch('/api/upcoming?days=30')).json();
  document.getElementById('upcoming').innerHTML =
    '<tr><th>Дата</th><th>Що</th><th>Сума</th><th>Попередження</th></tr>' +
    (up.map(x =>
      `<tr${x.warning ? ' class="warn"' : ''}><td>${x.date}</td>` +
      `<td>${emoji(x.subscription)} ${x.kind === 'trial_end' ? 'Кінець тріалу:' : ''} ${x.subscription.name}</td>` +
      `<td>${money(x.subscription.amount, x.subscription.currency)}</td>` +
      `<td>${x.kind === 'trial_end' && x.warning ? 'СКАСУЙТЕ ДО ЦІЄЇ ДАТИ' : ''}</td></tr>`).join('') ||
     '<tr><td colspan="4">нічого</td></tr>');
}
load();
// --- PWA: service worker + web notifications про списання сьогодні ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(() => {});
}
async function notifyToday() {
  if (!('Notification' in window)) return;
  let perm = Notification.permission;
  if (perm === 'default') perm = await Notification.requestPermission();
  if (perm !== 'granted') return;
  const items = await (await fetch('/api/today')).json();
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({type: 'charges-today', items});
  } else if (items.length) {
    new Notification(`Списань сьогодні: ${items.length}`,
                     {body: items.map(s => `${s.name} — ${money(s.amount, s.currency)}`).join('\n')});
  }
}
notifyToday();
</script>
</body>
</html>
